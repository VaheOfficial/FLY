[package]
name = "flybrain"
description = "Connectome-driven fruit fly nervous system simulation (portable, GPU compute via wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
wgpu = "30"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
