[workspace]
resolver = "2"
members = [
    "crates/flybrain",
    "crates/flypet",
    "tools/connectome-convert",
]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
flybrain = { path = "crates/flybrain" }

[profile.release]
lto = "thin"
codegen-units = 1
