[package]
name = "connectome-convert"
description = "Build-time tool: converts published connectome tables into the packed binary flybrain loads"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
flybrain.workspace = true
arrow = { version = "59", default-features = false, features = ["ipc", "ipc_compression", "prettyprint"] }
clap = { version = "4", features = ["derive"] }
ureq = "3"
